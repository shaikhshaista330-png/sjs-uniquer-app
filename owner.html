<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJS Unique Professional Salon</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function SJSApp() {
            const [view, setView] = useState('home');
            const [isBlocked, setIsBlocked] = useState(false);
            const [cart, setCart] = useState([]);

            const services = [
                { id: 1, name: 'Haircut & Styling', price: 499, icon: 'fa-cut' },
                { id: 2, name: 'Premium Facial', price: 999, icon: 'fa-face-smile' },
                { id: 3, name: 'Bridal Makeup', price: 4999, icon: 'fa-wand-magic-sparkles' },
                { id: 4, name: 'Manicure/Pedicure', price: 799, icon: 'fa-hand-sparkles' }
            ];

            if (isBlocked) {
                return (
                    <div class="flex flex-col items-center justify-center h-screen bg-white p-10 text-center">
                        <i class="fas fa-user-slash text-6xl text-red-500 mb-4"></i>
                        <h1 class="text-3xl font-bold text-gray-800">Account Blocked</h1>
                        <p class="text-gray-500 mt-2">SJS Administration has restricted your access.</p>
                        <button onClick={() => setIsBlocked(false)} class="mt-6 text-blue-600 underline text-sm">Contact Support</button>
                    </div>
                );
            }

            return (
                <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl pb-20">
                    {/* Header */}
                    <header class="bg-blue-900 text-white p-6 rounded-b-3xl shadow-lg text-center">
                        <h1 class="text-2xl font-bold tracking-wider">SJS UNIQUE</h1>
                        <p class="text-xs opacity-75">Professional Home Salon Services</p>
                    </header>

                    {/* Navigation Views */}
                    <div class="p-4">
                        {view === 'home' && (
                            <div class="space-y-6">
                                <div class="grid grid-cols-2 gap-4 mt-4">
                                    <div onClick={() => setView('services')} class="bg-blue-50 p-6 rounded-2xl text-center border border-blue-100 cursor-pointer hover:bg-blue-100 transition">
                                        <i class="fas fa-th-list text-2xl text-blue-900 mb-2"></i>
                                        <p class="font-bold text-blue-900 text-sm">Services</p>
                                    </div>
                                    <div onClick={() => setView('partner')} class="bg-green-50 p-6 rounded-2xl text-center border border-green-100 cursor-pointer hover:bg-green-100 transition">
                                        <i class="fas fa-handshake text-2xl text-green-700 mb-2"></i>
                                        <p class="font-bold text-green-700 text-sm">Partner</p>
                                    </div>
                                </div>
                                <div class="bg-gray-900 text-white p-6 rounded-2xl relative overflow-hidden shadow-xl">
                                    <h3 class="font-bold text-lg italic">"Glow at Home"</h3>
                                    <p class="text-sm opacity-70">Book top beauticians in 1-click.</p>
                                    <button onClick={() => setView('services')} class="mt-4 bg-white text-black px-4 py-2 rounded-lg text-xs font-bold">Explore Menu</button>
                                </div>
                                <p onClick={() => {
                                    const pin = prompt("Enter Admin PIN:");
                                    if(pin === "7860") setView('admin');
                                }} class="text-center text-gray-400 text-xs mt-10 cursor-pointer italic underline">Admin Login</p>
                            </div>
                        )}

                        {view === 'services' && (
                            <div>
                                <button onClick={() => setView('home')} class="text-blue-900 font-bold mb-4 flex items-center"><i class="fas fa-arrow-left mr-2"></i> Menu</button>
                                <h2 class="text-xl font-bold mb-4">Select Service</h2>
                                <div class="space-y-3">
                                    {services.map(s => (
                                        <div key={s.id} class="flex justify-between items-center p-4 border rounded-xl hover:border-blue-500">
                                            <div class="flex items-center">
                                                <i class={`fas ${s.icon} text-blue-900 mr-4 w-6`}></i>
                                                <div>
                                                    <p class="font-bold text-sm">{s.name}</p>
                                                    <p class="text-xs text-green-600 font-bold">₹{s.price}</p>
                                                </div>
                                            </div>
                                            <button onClick={() => alert('Booking feature coming soon!')} class="bg-blue-900 text-white px-3 py-1 rounded-md text-xs">Book</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'partner' && (
                            <div class="text-center py-6">
                                <button onClick={() => setView('home')} class="text-blue-900 font-bold mb-6 block text-left"><i class="fas fa-arrow-left mr-2"></i> Exit</button>
                                <div class="bg-white border rounded-3xl p-8 shadow-sm">
                                    <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center">
                                        <i class="fas fa-user text-3xl text-gray-400"></i>
                                    </div>
                                    <h2 class="text-xl font-bold">Partner Dashboard</h2>
                                    <div class="mt-6 flex justify-around border-t pt-6">
                                        <div>
                                            <p class="text-2xl font-bold text-green-600">₹19,250</p>
                                            <p class="text-xs text-gray-400 uppercase">Earnings</p>
                                        </div>
                                        <div>
                                            <p class="text-2xl font-bold text-yellow-500">4.8★</p>
                                            <p class="text-xs text-gray-400 uppercase">Rating</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div>
                                <button onClick={() => setView('home')} class="text-red-500 font-bold mb-6 flex items-center"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button>
                                <h2 class="text-xl font-bold mb-4">SJS Control Panel</h2>
                                <div class="bg-white p-4 border rounded-2xl flex justify-between items-center shadow-sm">
                                    <div class="flex items-center">
                                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3 text-blue-900 font-bold">A</div>
                                        <div>
                                            <p class="font-bold">Amit (Technician)</p>
                                            <p class="text-xs text-green-500">Verified</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { if(confirm('Block this user?')) setIsBlocked(true); }} class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Block</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SJSApp />);
    </script>
</body>
</html>
