<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJS Professional Home Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .category-card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-blue-600 p-4 text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-center">SJS Uniquer App</h1>
            <div class="mt-4 relative">
                <input type="text" placeholder="Search for beauty services..." class="w-full p-3 rounded-full text-black pl-12 shadow-inner focus:outline-none">
                <i class="fa fa-search absolute left-4 top-4 text-gray-400"></i>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
        <div class="flex space-x-4 overflow-x-auto pb-4 scrollbar-hide">
            <button class="bg-white px-6 py-2 rounded-full shadow border hover:bg-blue-100 whitespace-nowrap">All</button>
            <button class="bg-white px-6 py-2 rounded-full shadow border hover:bg-blue-100 whitespace-nowrap">Makeup</button>
            <button class="bg-white px-6 py-2 rounded-full shadow border hover:bg-blue-100 whitespace-nowrap">Hair Style</button>
            <button class="bg-white px-6 py-2 rounded-full shadow border hover:bg-blue-100 whitespace-nowrap">Skin Care</button>
        </div>

        <h2 class="text-xl font-bold my-4">Our Top Experts</h2>
        
        <div id="service-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-md border flex justify-between items-center category-card">
                <div>
                    <h3 class="font-bold text-lg text-blue-800">Sana Shaikh</h3>
                    <p class="text-gray-500 text-sm">Professional Beautician</p>
                    <p class="text-blue-600 font-bold mt-2">₹499</p>
                </div>
                <button onclick="openBooking('Sana Shaikh', 499)" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Book</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-md border flex justify-between items-center category-card">
                <div>
                    <h3 class="font-bold text-lg text-blue-800">Zoya Khan</h3>
                    <p class="text-gray-500 text-sm">Hair Styling Expert</p>
                    <p class="text-blue-600 font-bold mt-2">₹799</p>
                </div>
                <button onclick="openBooking('Zoya Khan', 799)" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Book</button>
            </div>
        </div>
    </div>

    <div id="bookingModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-md rounded-2xl p-6">
            <h2 class="text-2xl font-bold mb-4">Complete Booking</h2>
            <p id="modalService" class="text-gray-600 mb-4"></p>
            <input id="custName" type="text" placeholder="Your Name" class="w-full border p-3 rounded-lg mb-3">
            <input id="custPhone" type="tel" placeholder="Phone Number" class="w-full border p-3 rounded-lg mb-4">
            <button id="finalConfirm" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg">Confirm Booking</button>
            <button onclick="closeModal()" class="w-full mt-2 text-gray-500">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // YAHAN APNA FIREBASE CONFIG DAALEIN (JO PEHLE THA)
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "sjs-uniquer-app.firebaseapp.com",
            projectId: "sjs-uniquer-app",
            storageBucket: "sjs-uniquer-app.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedService = "";
        let selectedPrice = 0;

        window.openBooking = (name, price) => {
            selectedService = name;
            selectedPrice = price;
            document.getElementById('modalService').innerText = "Booking: " + name + " (₹" + price + ")";
            document.getElementById('bookingModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('bookingModal').classList.add('hidden');
        };

        document.getElementById('finalConfirm').onclick = async () => {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            
            if(!name || !phone) return alert("Please fill all details");

            await addDoc(collection(db, "bookings"), {
                customerName: name,
                phone: phone,
                service: selectedService,
                amount: selectedPrice,
                status: "Pending",
                time: new Date().toLocaleString()
            });

            alert("Kamyabi! Your booking is done.");
            closeModal();
        };
    </script>
</body>
</html>
