<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJS Professional Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
        <div class="bg-blue-600 p-6 text-white text-center rounded-b-3xl shadow-md">
            <h1 class="text-2xl font-bold italic">SJS Uniquer App</h1>
            <p class="text-sm opacity-90">Professional Home Services</p>
        </div>

        <div class="p-4">
            <h2 class="font-bold text-lg mb-4">Popular Services</h2>
            <div class="bg-white border rounded-xl p-4 flex justify-between items-center mb-4 shadow-sm">
                <div>
                    <h3 class="font-bold text-blue-800">Sana Shaikh</h3>
                    <p class="text-xs text-gray-500">Professional Beautician</p>
                    <p class="text-blue-600 font-bold mt-1">₹499</p>
                </div>
                <button onclick="bookService('Sana Shaikh', 499)" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700">Book</button>
            </div>
        </div>

        <div id="status" class="hidden fixed bottom-5 left-0 right-0 px-4">
            <div class="bg-green-500 text-white p-3 rounded-lg text-center shadow-lg">Booking Successful!</div>
        </div>
    </div>

    <script>
        // Aapka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAE-J-36YlDQb58r0m71tya...",
            authDomain: "sjs-uniquer-app.firebaseapp.com",
            projectId: "sjs-uniquer-app",
            storageBucket: "sjs-uniquer-app.firebasestorage.app",
            messagingSenderId: "958952795453",
            appId: "1:958952795453:web:849292e234...",
            measurementId: "G-0YN9F5X1VF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function bookService(partnerName, price) {
            db.collection("bookings").add({
                service: partnerName,
                amount: price,
                customerName: "Shaista Shaikh",
                time: new Date().toLocaleString(),
                status: "Pending"
            })
            .then(() => {
                const statusDiv = document.getElementById('status');
                statusDiv.classList.remove('hidden');
                setTimeout(() => statusDiv.classList.add('hidden'), 3000);
            })
            .catch((error) => alert("Error: " + error.message));
        }
    </script>
</body>
</html>
