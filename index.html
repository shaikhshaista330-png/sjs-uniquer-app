<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJS Unique Salon - Customer</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-blue-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function CustomerApp() {
            const [page, setPage] = useState('home');
            const [selectedPartner, setSelectedPartner] = useState(null);

            const services = [
                { id: 1, name: "Gold Facial", price: "₹1200", img: "https://images.unsplash.com/photo-1570172619240-6644f77569f1?w=200", pro: "Sana Shaikh" },
                { id: 2, name: "Hair Spa", price: "₹800", img: "https://images.unsplash.com/photo-1522337660859-02fbefca4702?w=200", pro: "Arif Khan" }
            ];

            return (
                <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl pb-20">
                    {/* Header */}
                    <header class="bg-blue-700 p-6 rounded-b-[30px] text-white">
                        <h1 class="text-2xl font-black">SJS Salon Service</h1>
                        <p class="text-xs opacity-80 italic">Luxury Salon at your doorstep</p>
                        <div class="mt-4 bg-white/20 p-3 rounded-xl flex items-center">
                            <i class="fas fa-map-marker-alt mr-2 text-yellow-300"></i>
                            <input type="text" placeholder="Enter your address..." class="bg-transparent border-none outline-none text-white text-sm w-full placeholder:text-blue-100" />
                        </div>
                    </header>

                    {/* Services Gallery */}
                    <main class="p-6">
                        <h2 class="font-bold text-gray-800 mb-4 text-lg">Select Professional Service</h2>
                        <div class="grid grid-cols-1 gap-4">
                            {services.map(s => (
                                <div key={s.id} class="bg-blue-50 p-4 rounded-3xl flex items-center justify-between border border-blue-100">
                                    <div class="flex items-center">
                                        <img src={s.img} class="w-16 h-16 rounded-2xl object-cover mr-4 border-2 border-white shadow-md" />
                                        <div>
                                            <p class="font-bold text-blue-900">{s.name}</p>
                                            <p class="text-xs text-blue-600 font-bold">{s.price}</p>
                                            <p class="text-[10px] text-gray-400">By {s.pro} ⭐4.8</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setPage('booking')} class="bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Book Now</button>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Booking View (Mockup) */}
                    {page === 'booking' && (
                        <div class="fixed inset-0 bg-white z-[60] p-6 flex flex-col">
                            <button onClick={() => setPage('home')} class="text-blue-700 mb-6 font-bold"><i class="fas fa-arrow-left"></i> Back</button>
                            <h2 class="text-xl font-bold mb-4 italic text-blue-900 underline decoration-yellow-400">Confirm Booking</h2>
                            
                            <div class="bg-gray-100 p-4 rounded-2xl mb-6">
                                <p class="text-xs font-bold text-gray-400 uppercase">Payment Mode</p>
                                <div class="flex gap-4 mt-2">
                                    <button class="flex-1 border-2 border-blue-700 p-3 rounded-xl text-xs font-bold bg-blue-50">Online Pay</button>
                                    <button class="flex-1 border-2 border-gray-200 p-3 rounded-xl text-xs font-bold">Cash After Service</button>
                                </div>
                            </div>

                            <p class="text-xs text-gray-500 mb-6">Note: You can cancel up to 1 hour before service. Reschedule anytime.</p>
                            
                            <button class="mt-auto w-full bg-blue-900 text-white p-5 rounded-2xl font-black text-lg shadow-xl" onClick={() => alert("Booking Sent to Owner!")}>Confirm & Locate Map</button>
                        </div>
                    )}

                    {/* Bottom Nav */}
                    <nav class="fixed bottom-0 w-full max-w-md bg-white border-t p-4 flex justify-around shadow-2xl rounded-t-3xl">
                        <i class="fas fa-home text-blue-700 text-xl"></i>
                        <i class="fas fa-calendar-alt text-gray-400 text-xl"></i>
                        <i class="fas fa-user-circle text-gray-400 text-xl"></i>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CustomerApp />);
    </script>
</body>
</html>
