<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJS Professional Uniquer Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 pb-40 font-sans">
    <div class="h-64 bg-black relative shadow-lg">
        <img src="https://images.unsplash.com/photo-1512690190424-bb698041076b?auto=format&fit=crop&w=800" class="w-full h-full object-cover opacity-60">
        <div class="absolute inset-0 flex flex-col justify-center items-center text-white px-6">
            <h1 class="text-3xl font-black italic uppercase text-center">SJS PROFESSIONAL <br> <span class="text-blue-400">UNIQUER SALON</span></h1>
            <p class="text-[9px] tracking-[4px] mt-3 text-gray-300 uppercase">Premium Home Delivery Service</p>
        </div>
    </div>

    <div class="fixed top-24 right-4 flex flex-col gap-3 z-50">
        <a href="tel:+91XXXXXXXXXX" class="bg-green-600 p-4 rounded-full shadow-2xl text-white"><i class="fa fa-phone"></i></a>
        <a href="https://wa.me/91XXXXXXXXXX" class="bg-green-500 p-4 rounded-full shadow-2xl text-white"><i class="fab fa-whatsapp"></i></a>
    </div>

    <div class="max-w-md mx-auto p-6">
        <h2 class="text-xl font-black mb-6 border-l-4 border-blue-700 pl-3">OUR SERVICES</h2>
        <div id="serviceGrid" class="space-y-4"></div>
    </div>

    <div id="billFloat" class="fixed bottom-0 inset-x-0 bg-white p-6 rounded-t-[40px] shadow-[0_-15px_30px_rgba(0,0,0,0.1)] hidden z-50">
        <div class="max-w-md mx-auto flex justify-between items-center mb-4">
            <span class="font-bold text-gray-500">Selected Total:</span>
            <span id="totalBill" class="text-3xl font-black text-blue-700">₹0</span>
        </div>
        <button onclick="document.getElementById('m').classList.remove('hidden')" class="w-full bg-blue-700 text-white py-5 rounded-2xl font-black shadow-xl">BOOK SERVICE</button>
    </div>

    <div id="m" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-8">
            <h2 class="text-xl font-bold mb-4">Delivery Address</h2>
            <input id="n" placeholder="Name" class="w-full bg-gray-100 p-4 rounded-xl mb-3 outline-none">
            <input id="p" placeholder="Mobile" class="w-full bg-gray-100 p-4 rounded-xl mb-3 outline-none">
            <textarea id="a" placeholder="Complete Address" class="w-full bg-gray-100 p-4 rounded-xl mb-4 h-24 outline-none"></textarea>
            <button onclick="submitOrder()" class="w-full bg-black text-white py-4 rounded-xl font-bold">CONFIRM BOOKING</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDACXw-d_U5Y1yxU4RziUTk",
            authDomain: "sjs-professional-uniquer.firebaseapp.com",
            projectId: "sjs-professional-uniquer",
            storageBucket: "sjs-professional-uniquer.firebasestorage.app",
            messagingSenderId: "302804271585",
            appId: "1:302804271585:web:bc2310655866898b9da886",
            measurementId: "G-7DZHVN1YDB"
        };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let sel = []; let total = 0;

        onSnapshot(collection(db, "services"), (s) => {
            const g = document.getElementById('serviceGrid'); g.innerHTML = "";
            s.forEach(d => { const v = d.data(); g.innerHTML += `<div class="bg-white p-5 rounded-2xl border flex justify-between items-center" onclick="toggle('${d.id}','${v.name}',${v.price},this)"><div><p class="font-bold">${v.name}</p><p class="text-blue-600 font-bold">₹${v.price}</p></div><div class="w-6 h-6 border-2 rounded-full"></div></div>`; });
        });

        window.toggle = (id, name, price, el) => {
            if(sel.find(x => x.id === id)) { sel = sel.filter(x => x.id !== id); el.style.border = "1px solid #eee"; }
            else { sel.push({id, name, price}); el.style.border = "3px solid #1d4ed8"; }
            total = sel.reduce((a, b) => a + b.price, 0);
            document.getElementById('totalBill').innerText = "₹" + total;
            document.getElementById('billFloat').style.display = total > 0 ? "block" : "none";
        };

        window.submitOrder = async () => {
            const name = document.getElementById('n').value, phone = document.getElementById('p').value, addr = document.getElementById('a').value;
            if(!name || !phone || !addr) return alert("Fill details");
            await addDoc(collection(db, "bookings"), { name, phone, addr, total, items: sel, time: new Date().toLocaleString() });
            alert("Booking Done! ₹" + total); location.reload();
        };
    </script>
</body>
</html>
