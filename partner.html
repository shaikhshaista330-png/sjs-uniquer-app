<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJS Partner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-800 text-white p-5 flex justify-between items-center shadow-lg">
        <div>
            <h1 id="displayPartnerName" class="text-xl font-bold">Partner Portal</h1>
            <p id="verifyBadge" class="text-xs text-red-300 font-bold underline">Verification Pending</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium">Status:</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="statusToggle" class="sr-only peer" onchange="toggleStatus()">
                <div class="w-11 h-6 bg-gray-400 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
            </label>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4 space-y-4">
        
        <div id="regBox" class="bg-white p-6 rounded-3xl shadow-md border-t-4 border-blue-800">
            <h2 class="text-lg font-bold mb-4">Complete Your Profile</h2>
            <div class="space-y-4">
                <input type="text" id="pName" placeholder="Full Name" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-blue-500">
                <select id="pCategory" class="w-full p-4 bg-gray-50 rounded-xl border outline-none">
                    <option value="">Select Category</option>
                    <option value="Makeup">Makeup Expert</option>
                    <option value="Hair">Hair Styling</option>
                    <option value="Skin">Skin/Facial Expert</option>
                </select>
                <button onclick="registerPartner()" class="w-full bg-blue-800 text-white py-4 rounded-xl font-bold text-lg">JOIN AS PARTNER</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-3xl shadow shadow-blue-100 border-b-4 border-blue-500">
                <p class="text-gray-400 text-xs">Total Earnings</p>
                <h3 class="text-2xl font-black text-blue-800">₹0.00</h3>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow shadow-blue-100 border-b-4 border-green-500">
                <p class="text-gray-400 text-xs">Active Bookings</p>
                <h3 id="activeCount" class="text-2xl font-black text-green-800">0</h3>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md">
            <h2 class="text-lg font-bold mb-4"><i class="fa fa-calendar-alt text-blue-600 mr-2"></i> Availability & Slots</h2>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setSlot('Morning')" class="slot-btn border p-3 rounded-xl text-xs font-bold hover:bg-blue-50">Morning (10-1)</button>
                <button onclick="setSlot('Afternoon')" class="slot-btn border p-3 rounded-xl text-xs font-bold hover:bg-blue-50">Afternoon (1-5)</button>
                <button onclick="setSlot('Evening')" class="slot-btn border p-3 rounded-xl text-xs font-bold hover:bg-blue-50">Evening (5-9)</button>
            </div>
        </div>

        <div class="space-y-3">
            <h2 class="text-lg font-bold px-2">New Customer Requests</h2>
            <div id="bookingList" class="space-y-3 text-center py-10 text-gray-400">
                No orders yet. Go Online to see requests.
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // !!! APNA FIREBASE CONFIG !!!
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "sjs-uniquer-app.firebaseapp.com",
            projectId: "sjs-uniquer-app",
            storageBucket: "sjs-uniquer-app.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentPartnerID = localStorage.getItem('partnerID');

        // Registration
        window.registerPartner = async () => {
            const name = document.getElementById('pName').value;
            const cat = document.getElementById('pCategory').value;
            if(!name || !cat) return alert("All fields are required!");

            const docRef = await addDoc(collection(db, "partners"), {
                name: name,
                category: cat,
                verified: false,
                status: "offline",
                slots: []
            });
            
            localStorage.setItem('partnerID', docRef.id);
            location.reload();
        };

        // UI Initialization
        if(currentPartnerID) {
            document.getElementById('regBox').classList.add('hidden');
            onSnapshot(doc(db, "partners", currentPartnerID), (doc) => {
                const data = doc.data();
                document.getElementById('displayPartnerName').innerText = "Hi, " + data.name;
                if(data.verified) {
                    document.getElementById('verifyBadge').innerText = "Verified Expert";
                    document.getElementById('verifyBadge').className = "text-xs text-green-300 font-bold";
                }
            });
        }

        // Online/Offline Switch
        window.toggleStatus = async () => {
            if(!currentPartnerID) return alert("Register first!");
            const isOnline = document.getElementById('statusToggle').checked;
            await updateDoc(doc(db, "partners", currentPartnerID), {
                status: isOnline ? "online" : "offline"
            });
        };

        // Real-time Bookings Filter
        if(currentPartnerID) {
            onSnapshot(collection(db, "bookings"), (snapshot) => {
                const list = document.getElementById('bookingList');
                list.innerHTML = "";
                let count = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    count++;
                    list.innerHTML += `
                        <div class="bg-white p-5 rounded-3xl shadow-sm border flex justify-between items-center animate-pulse border-blue-100">
                            <div>
                                <h4 class="font-bold text-gray-800">${data.service}</h4>
                                <p class="text-xs text-gray-400">Customer: ${data.customer}</p>
                                <p class="text-blue-600 font-bold">₹${data.price}</p>
                            </div>
                            <button class="bg-green-600 text-white px-5 py-2 rounded-xl text-sm font-bold">Accept</button>
                        </div>`;
                });
                document.getElementById('activeCount').innerText = count;
            });
        }
    </script>
</body>
</html>
