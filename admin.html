<!DOCTYPE html>
<html>
<head><title>SJS Owner Panel</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 text-white p-6 font-sans">
    <div class="max-w-xl mx-auto space-y-8">
        <h1 class="text-2xl font-black text-blue-400">SJS OWNER COMMAND CENTER</h1>
        
        <div class="bg-gray-800 p-6 rounded-3xl border border-gray-700">
            <h2 class="font-bold mb-4 italic">Add New Service</h2>
            <input id="sn" placeholder="Service Name (e.g. Hair Cut)" class="w-full bg-gray-700 p-4 rounded-xl mb-3 border-none outline-none">
            <input id="sp" type="number" placeholder="Price (₹)" class="w-full bg-gray-700 p-4 rounded-xl mb-4 border-none outline-none">
            <button onclick="add()" class="w-full bg-blue-600 py-4 rounded-xl font-bold shadow-lg">UPDATE CUSTOMER APP</button>
        </div>

        <h2 class="text-xl font-bold border-b border-gray-700 pb-2 text-gray-400 uppercase tracking-widest text-sm">Active Bookings</h2>
        <div id="list" class="space-y-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDACXw-d_U5Y1yxU4RziUTk",
            authDomain: "sjs-professional-uniquer.firebaseapp.com",
            projectId: "sjs-professional-uniquer",
            storageBucket: "sjs-professional-uniquer.firebasestorage.app",
            messagingSenderId: "302804271585",
            appId: "1:302804271585:web:bc2310655866898b9da886",
            measurementId: "G-7DZHVN1YDB"
        };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        window.add = async () => {
            const n = document.getElementById('sn').value, p = parseInt(document.getElementById('sp').value);
            if(!n || !p) return alert("Enter name and price");
            await addDoc(collection(db, "services"), { name: n, price: p }); 
            alert("Service Added!"); document.getElementById('sn').value = ""; document.getElementById('sp').value = "";
        };

        onSnapshot(collection(db, "bookings"), (snap) => {
            const l = document.getElementById('list'); l.innerHTML = "";
            snap.forEach(d => {
                const b = d.data();
                l.innerHTML += `<div class="bg-gray-800 p-6 rounded-3xl border border-gray-700 mb-4 shadow-2xl">
                    <div class="flex justify-between mb-2"><span class="font-bold text-xl uppercase italic">${b.name}</span><span class="text-green-400 font-black text-xl">₹${b.total}</span></div>
                    <p class="text-xs text-gray-500 mb-1">Time: ${b.time}</p>
                    <p class="text-sm text-gray-300 mb-4">📍 ${b.addr}</p>
                    <div class="flex gap-2">
                        <a href="tel:${b.phone}" class="flex-1 bg-green-600 py-3 rounded-xl text-center font-bold text-xs uppercase tracking-tighter">📞 Call Customer</a>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.addr)}" target="_blank" class="flex-1 bg-blue-600 py-3 rounded-xl text-center font-bold text-xs uppercase tracking-tighter">📍 Open Map</a>
                    </div>
                </div>`;
            });
        });
    </script>
</body>
</html>
